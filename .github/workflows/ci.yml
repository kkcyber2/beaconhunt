name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          printf 'ts,dest,port,bytes_out\n' > /tmp/c.csv
          for i in $(seq 0 29); do echo "$((i*60)),c2.example.com,443,512" >> /tmp/c.csv; done
          beaconhunt /tmp/c.csv --fail-on 70
