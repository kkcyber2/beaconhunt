[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconhunt"
version = "0.1.0"
description = "Detect C2 beaconing in connection logs by interval regularity, jitter and payload constancy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "c2", "beaconing", "dfir", "threat-hunting", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
beaconhunt = "beaconhunt.cli:main"

[tool.setuptools.packages.find]
include = ["beaconhunt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
